<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Juan David Páez</title>
  <desc id="desc">Desarrollador backend .NET en Madrid. IA aplicada y automatización documental.</desc>

  <defs>
    <clipPath id="card">
      <rect width="1200" height="330" rx="16"/>
    </clipPath>
    <style>
      text { font-family: 'JetBrainsMono Nerd Font', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .bubble { fill: #cdd6f4; fill-opacity: 0.06; }
      .pill { fill: #1e1e2e; stroke: #a08f95; stroke-opacity: 0.55; stroke-width: 1.5; }
      .label { font-size: 13px; fill: #cdd6f4; text-anchor: middle; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="330" fill="#1e1e2e"/>

    <!-- Barra superior: misma forma que waybar en los dotfiles -->
    <rect width="1200" height="72" fill="#cdd6f4" fill-opacity="0.03"/>

    <rect class="bubble" x="24" y="22" width="36" height="28" rx="10"/>
    <text class="label" x="42" y="41">1</text>
    <rect x="68" y="22" width="36" height="28" rx="10" fill="#8a63c7"/>
    <text class="label" x="86" y="41" style="fill:#c7ced6">2</text>
    <rect class="bubble" x="112" y="22" width="36" height="28" rx="10"/>
    <text class="label" x="130" y="41">3</text>
    <rect class="bubble" x="156" y="22" width="36" height="28" rx="10"/>
    <text class="label" x="174" y="41">4</text>

    <rect class="pill" x="551" y="22" width="75" height="28" rx="10"/>
    <text class="label" x="588.5" y="41">Madrid</text>
    <rect class="pill" x="634" y="22" width="98" height="28" rx="10"/>
    <text class="label" x="683" y="41">C# / .NET</text>
    <rect class="pill" x="740" y="22" width="114" height="28" rx="10"/>
    <text class="label" x="797" y="41">IA aplicada</text>
    <rect class="pill" x="862" y="22" width="145" height="28" rx="10"/>
    <text class="label" x="934.5" y="41">Arch + Hyprland</text>
    <rect class="pill" x="1015" y="22" width="161" height="28" rx="10" style="stroke:#6f9f98;stroke-opacity:1"/>
    <text class="label" x="1095.5" y="41" style="fill:#6f9f98">abierto a ofertas</text>

    <text x="600" y="168" text-anchor="middle" font-size="56" font-weight="700" fill="#cdd6f4">Juan David Páez</text>
    <text x="600" y="212" text-anchor="middle" font-size="22" fill="#c7ced6">Desarrollador backend .NET <tspan fill="#a08f95">/</tspan> <tspan fill="#6f9f98">IA y automatización documental</tspan></text>

    <text x="600" y="262" text-anchor="middle" font-size="16"><tspan fill="#8a63c7">juan@arch</tspan><tspan fill="#a08f95"> ~ $ </tspan><tspan fill="#cdd6f4">chezmoi apply</tspan><tspan fill="#cdd6f4" dx="4">
      <animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>_</tspan></text>

    <!-- Paleta de los dotfiles, en el mismo orden que su README -->
    <rect x="0" y="318" width="134" height="12" fill="#1e1e2e" stroke="#cdd6f4" stroke-opacity="0.08"/>
    <rect x="133.33" y="318" width="134" height="12" fill="#cdd6f4"/>
    <rect x="266.67" y="318" width="134" height="12" fill="#8a63c7"/>
    <rect x="400" y="318" width="134" height="12" fill="#6f9f98"/>
    <rect x="533.33" y="318" width="134" height="12" fill="#c44532"/>
    <rect x="666.67" y="318" width="134" height="12" fill="#8e6f86"/>
    <rect x="800" y="318" width="134" height="12" fill="#8c6e6e"/>
    <rect x="933.33" y="318" width="134" height="12" fill="#a08f95"/>
    <rect x="1066.67" y="318" width="134" height="12" fill="#c7ced6"/>
  </g>
</svg>
